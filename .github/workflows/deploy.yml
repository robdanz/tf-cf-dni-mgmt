name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      
    - name: Check Cloudflare secrets
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN secret is not set"
          echo "Please add it in: Settings → Secrets and variables → Actions → New repository secret"
          exit 1
        fi
        if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID secret is not set"
          echo "Please add it in: Settings → Secrets and variables → Actions → New repository secret"
          exit 1
        fi
        echo "✅ Cloudflare secrets configured"

    - name: Debug Cloudflare credentials
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
        echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
        echo "Account ID starts with: ${CLOUDFLARE_ACCOUNT_ID:0:8}..."
        echo "Token starts with: ${CLOUDFLARE_API_TOKEN:0:8}..."

    - name: Deploy to Cloudflare Workers
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: npx wrangler deploy --env production
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
